<!doctype html>
<html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Bengkel Norilightlight</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head><body class="min-h-screen antialiased"><main class="site-shell mx-auto max-w-6xl px-6"><nav id="nav" class="navbar flex items-center justify-between" aria-label="Navigasi utama" data-menu><span class="brand">Bengkel Norilightlight</span><button type="button" class="mobile-toggle" data-menu-button aria-expanded="false" aria-controls="wcg-nav-links">Menu</button><div id="wcg-nav-links" class="nav-links"><a class="" href="#main">Beranda</a></div></nav><section id="main" class="hero centered" ><div><h1>Bengkel Norilightlight</h1></div><div><p>Kami mendampingi usaha kecil untuk merencanakan kegiatan bersama.</p></div></section><section id="contact" class="content-section" ><h2>Hubungi Kami</h2><p class="notice">Formulir contoh. Pesan tidak dikirim.</p><form class="form" data-form-validate><label class="field" for="wcg-contact-nama">Nama<input id="wcg-contact-nama" name="nama" type="text" required></label><label class="field" for="wcg-contact-email">Email<input id="wcg-contact-email" name="email" type="email" required></label><label class="field" for="wcg-contact-pesan">Pesan<textarea id="wcg-contact-pesan" name="pesan" required></textarea></label><button class="button" type="submit">Kirim</button><p data-form-status class="form-status" role="status"></p></form></section><footer id="footer" class="footer"><p>Bengkel Norilightlight</p><div></div></footer></main></body></html>
